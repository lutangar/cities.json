name: Release

on:
  push:
    branches: ['master']
  schedule:
    - cron: '0 0 1 * *'
jobs:
  release:
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): no npm token to rotate. contents: write lets
    # release-it push the release commit and tag and create the GitHub release.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1 # the first npm that publishes through OIDC
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
